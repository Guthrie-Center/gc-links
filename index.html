const FAVORITES_KEY='guthrie-links-favorites-v1';
let favorites=[],editingFavorites=false;
try{const saved=JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]');if(Array.isArray(saved)){favorites=[...new Set(saved.map(value=>{const link=LINKS.find(l=>l.id===value||l.url===value||(l.legacyUrls||[]).includes(value));return link?link.id:null;}).filter(Boolean))];if(JSON.stringify(saved)!==JSON.stringify(favorites))localStorage.setItem(FAVORITES_KEY,JSON.stringify(favorites));}}catch(error){}
const favoritesGrid=document.getElementById('favorites-grid'),favoritesHelp=document.getElementById('favorites-help'),favoritesStatus=document.getElementById('favorites-status'),editFavorites=document.getElementById('edit-favorites');
function saveFavorites(){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favorites));favoritesStatus.textContent='Favorites saved in this browser.'}catch(error){favoritesStatus.textContent='Your browser could not save favorites. They will last for this visit.'}}
function toggleFavorite(url){const index=favorites.indexOf(url);if(index<0)favorites.push(url);else favorites.splice(index,1);saveFavorites();render();}
function moveFavorite(url,direction){const index=favorites.indexOf(url),next=index+direction;if(index<0||next<0||next>=favorites.length)return;[favorites[index],favorites[next]]=[favorites[next],favorites[index]];saveFavorites();render();}
let draggedFavorite=null;
function reorderFavorite(url,targetUrl){const from=favorites.indexOf(url),to=favorites.indexOf(targetUrl);if(from<0||to<0||from===to)return;favorites.splice(from,1);favorites.splice(to,0,url);saveFavorites();render();}
function startFavoriteDrag(event,url,handle,item){if(event.pointerType==='mouse')return;event.preventDefault();let targetUrl=null;item.classList.add('dragging-favorite');const targets=Array.from(favoritesGrid.querySelectorAll('.link-item'));function clear(){targets.forEach(node=>node.classList.remove('drop-favorite'));}function move(e){e.preventDefault();clear();let nearest=null,distance=Infinity;for(const node of targets){if(node===item)continue;const rect=node.getBoundingClientRect();const dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2);const d=dx*dx+dy*dy;if(d<distance){distance=d;nearest=node;}}targetUrl=nearest?nearest.dataset.favoriteId:null;if(nearest)nearest.classList.add('drop-favorite');}function finish(e){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel);clear();item.classList.remove('dragging-favorite');if(targetUrl)reorderFavorite(url,targetUrl);}function cancel(){targetUrl=null;finish();}window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',cancel);}
function makeCard(l,inFavorites=false){const item=document.createElement('div');item.className='link-item';const card=document.createElement('a');card.className='card';card.href=l.url;card.target='_blank';card.rel='noopener noreferrer';card.append(document.createTextNode(l.title));if(l.note){const note=document.createElement('span');note.className='note';note.textContent=l.note;card.append(note)}item.append(card);const choose=document.createElement('button');choose.type='button';choose.className='favorite-toggle';const selected=favorites.includes(l.id);const filterId='favorite-g-'+l.id;choose.innerHTML='<svg class="favorite-g" viewBox="0 0 500 500" aria-hidden="true"><defs><filter id="'+filterId+'" x="0" y="0" width="100%" height="100%">'+(selected?'':'<feMorphology in="SourceAlpha" operator="erode" radius="18" result="inside"/><feComposite in="SourceAlpha" in2="inside" operator="out" result="edge"/>')+'<feFlood flood-color="currentColor" result="color"/><feComposite in="color" in2="'+(selected?'SourceAlpha':'edge')+'" operator="in"/></filter></defs><image href="'+FAVORITE_G_LOGO+'" width="500" height="500" filter="url(#'+filterId+')"/></svg>';choose.setAttribute('aria-pressed',String(selected));choose.setAttribute('aria-label',(selected?'Remove ':'Add ')+l.title+(selected?' from favorites':' to favorites'));choose.title=selected?'Remove from favorites':'Add to favorites';choose.addEventListener('click',()=>toggleFavorite(l.id));item.append(choose);if(inFavorites)item.dataset.favoriteId=l.id;if(editingFavorites&&inFavorites){item.classList.add('can-reorder');item.draggable=true;item.addEventListener('dragstart',event=>{draggedFavorite=l.id;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',l.id);item.classList.add('dragging-favorite');});item.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move';item.classList.add('drop-favorite');});item.addEventListener('dragleave',()=>item.classList.remove('drop-favorite'));item.addEventListener('drop',event=>{event.preventDefault();event.stopPropagation();const url=draggedFavorite||event.dataTransfer.getData('text/plain');draggedFavorite=null;reorderFavorite(url,l.id);});item.addEventListener('dragend',()=>{draggedFavorite=null;for(const node of favoritesGrid.querySelectorAll('.link-item'))node.classList.remove('dragging-favorite','drop-favorite');});card.draggable=false;card.addEventListener('click',event=>event.preventDefault());const handle=document.createElement('button');handle.type='button';handle.className='drag-favorite';handle.textContent='⠿';handle.title='Drag to reorder';handle.setAttribute('aria-label','Reorder '+l.title+'. Drag, or use arrow keys.');handle.addEventListener('pointerdown',event=>startFavoriteDrag(event,l.id,handle,item));handle.addEventListener('keydown',event=>{if(['ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(event.key)){event.preventDefault();moveFavorite(l.id,['ArrowUp','ArrowLeft'].includes(event.key)?-1:1);const next=Array.from(favoritesGrid.querySelectorAll('.link-item')).find(el=>el.dataset.favoriteId===l.id);if(next)next.querySelector('.drag-favorite').focus();}});item.append(handle);}return item;}
function render(){const q=search.value.trim().toLowerCase();const filtered=LINKS.filter(l=>[l.title,l.category,l.group,l.note].join(' ').toLowerCase().includes(q));favoritesGrid.replaceChildren();for(const url of favorites){const l=filtered.find(l=>l.id===url);if(l)favoritesGrid.append(makeCard(l,true));}favoritesHelp.textContent=editingFavorites?'Drag favorites to reorder, then choose Done.':favorites.length?'Tap a filled G to return a link to its group.': 'Tap an outlined G to move a link here.';editFavorites.textContent=editingFavorites?'Done':'Reorder favorites';editFavorites.setAttribute('aria-pressed',String(editingFavorites));directory.replaceChildren();for(const group of ['Guthrie','SBISD','Other resources']){const items=filtered.filter(l=>l.group===group&&!favorites.includes(l.id));if(!items.length)continue;const section=document.createElement('section');section.className='link-group';section.dataset.group=group;const heading=document.createElement('h2');heading.textContent=group.toUpperCase();const grid=document.createElement('div');grid.className='grid';for(const l of items)grid.append(makeCard(l));section.append(heading,grid);directory.append(section)}document.querySelector('#count').textContent=filtered.length+' of '+LINKS.length+' resources'+(q?' shown':' · Links open in a new tab');document.querySelector('#empty').hidden=filtered.length!==0;}
editFavorites.addEventListener('click',()=>{editingFavorites=!editingFavorites;favoritesStatus.textContent='';render();});
search.addEventListener('input',render);render();

const shareButton=document.getElementById('share-page'),shareStatus=document.getElementById('share-status');
shareButton.addEventListener('click',async()=>{const url='https://guthrie-center.github.io/gc-links/';shareStatus.textContent='';if(navigator.share){try{await navigator.share({title:'Guthrie Links',text:'One Place for All of Them',url});return}catch(error){if(error.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);shareStatus.textContent='Link copied.'}catch(error){shareStatus.textContent='Copy this address: '+url}});
</script></body></html>
